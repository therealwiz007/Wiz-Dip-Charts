name: Wiz Dip Charts - Production APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-build:
    name: Build Signed Production APK and AAB
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check signing secrets
        shell: bash
        run: |
          set -e
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Missing GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Decode signing keystore
        shell: bash
        run: |
          set -e
          KEYSTORE_PATH="$RUNNER_TEMP/wiz-dip-charts.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build signed APK and AAB
        run: gradle --no-daemon clean :app:assembleRelease :app:bundleRelease

      - name: Name release files with the version
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          VNAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          BASE="Wiz Dip Charts (${VNAME})"
          mkdir -p dist/apk dist/aab
          cp "$APK" "dist/apk/${BASE}.apk"
          cp "$AAB" "dist/aab/${BASE}.aab"
          ls -l dist/apk dist/aab
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Upload APK (install on phone)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE }} APK
          path: dist/apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload AAB (Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BASE }} AAB
          path: dist/aab/*.aab
          if-no-files-found: error
          retention-days: 30
