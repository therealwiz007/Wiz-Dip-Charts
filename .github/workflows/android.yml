
name: Wiz Dip Charts - Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Build Signed AAB
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Install Android SDK packages
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # 5. Verify SDK installation
      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed
          echo "SDK installation successful"

      # 6. Run unit tests
      - name: Run Unit Tests
        run: gradle test

      # 7. Restore signing keystore
      - name: Restore Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wiz-dip-charts.jks"
          test -s "$RUNNER_TEMP/wiz-dip-charts.jks"

      # 8. Validate keystore
      - name: Verify Signing Key
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/wiz-dip-charts.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      # 9. Build signed Play Store AAB
      - name: Build Signed AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/wiz-dip-charts.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease

      # 10. Upload AAB
      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Wiz-Dip-Charts-Play-Store-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      # 11. Build debug APK for testing
      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wiz-Dip-Charts-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
